services:
  alephbot:
    image: alephbot:latest
    container_name: alephbot

    networks:
      - interna
      - dados

    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_CONFIGURATION: Release

    # o bot precisa voltar sozinho depois de reboot da VPS
    restart: unless-stopped

    # PID 1 de verdade: repassa SIGTERM e recolhe processos órfãos
    init: true

    # tempo pro gateway fechar a conexão com o Discord antes do SIGKILL
    stop_grace_period: 20s

    # TOKEN, PREFIX, DEV_GUILD_ID, LOG_LEVEL — o mesmo arquivo do dev, fora da imagem
    env_file:
      - Config/.env

    environment:
      DOTNET_ENVIRONMENT: Production
      # o NLog não desliga cor sozinho, e o `docker logs` vinha cheio de escape ANSI
      NO_COLOR: "1"
      TZ: America/Sao_Paulo

      # na rede do compose o Lavalink atende pelo nome; isto vence o Config/.env
      LAVALINK_URI: http://lavalink:2333/
      LAVALINK_PASSWORD: ${LAVALINK_PASSWORD:-youshallnotpass}

      # semente do login do YouTube: só lida no primeiro boot; depois o token mora no aleph-data
      YOUTUBE_REFRESH_TOKEN: ${YOUTUBE_REFRESH_TOKEN:-}

      # o áudio do YouTube vem do yt-audio. Vazio = tudo pelo plugin do Lavalink
      YOUTUBE_AUDIO_URI: http://yt-audio:8080/

      # a API escuta sempre na 8080 do contêiner; a porta de fora é a do `ports` abaixo
      API_PORT: "8080"

      # o banco atende pelo nome do serviço. Vazio = o bot sobe sem banco
      DATABASE_URL: ${DATABASE_URL:-Host=postgres;Database=aleph;Username=aleph;Password=${POSTGRES_PASSWORD:-}}

    # a API de status, só no localhost: a chave viaja em texto puro, e pra fora precisa de HTTPS
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8080}:8080"

    # espera o Lavalink aceitar conexão: só ordenar a partida abria o boot com "connection refused"
    depends_on:
      lavalink:
        condition: service_healthy
      postgres:
        condition: service_healthy

    # os logs em arquivo do NLog (${basedir}/logs) e o token do YouTube sobrevivem ao recreate
    volumes:
      - aleph-logs:/app/logs
      - aleph-data:/app/data

    # o stdout do container também rotaciona, senão enche o disco da VPS
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    deploy:
      resources:
        limits:
          memory: 512M

  # quem decodifica o áudio e fala com a voz do Discord. Sem `ports`: só a rede interna
  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4.2.2
    container_name: alephbot-lavalink

    networks:
      - interna

    restart: unless-stopped
    init: true

    # o cipher decifra as assinaturas do player; o warp é por onde ele sai pra internet
    depends_on:
      - yt-cipher
      - warp

    environment:
      # o application.yml lê esta variável, a mesma do bot: a senha fica num lugar só
      LAVALINK_PASSWORD: ${LAVALINK_PASSWORD:-youshallnotpass}
      TZ: America/Sao_Paulo
      # heap de 1 G: buffer maior evita engasgada, e o limite do contêiner fica acima dele
      #
      # as -Dsocks* mandam ele pra internet pelo WARP; yt-cipher e yt-audio ficam de fora
      _JAVA_OPTIONS: "-Xmx1g -DsocksProxyHost=warp -DsocksProxyPort=9091 -DsocksNonProxyHosts=yt-cipher|yt-audio|localhost|127.*"

      # o token do YouTube não entra aqui: quem entrega é o bot, a cada conexão, pela REST do plugin

      # "Sign in to confirm you're not a bot": o par abaixo é a resposta, só nos clients WEB
      #   docker run --rm quay.io/invidious/youtube-trusted-session-generator
      # Vazio = sem poToken.
      PLUGINS_YOUTUBE_POT_TOKEN: ${YOUTUBE_PO_TOKEN:-}
      PLUGINS_YOUTUBE_POT_VISITORDATA: ${YOUTUBE_VISITOR_DATA:-}

    volumes:
      - ./Lavalink/application.yml:/opt/Lavalink/application.yml:ro
      # sem isto o plugin do YouTube é baixado de novo a cada recreate
      - lavalink-plugins:/opt/Lavalink/plugins

    # toda rota do Lavalink pede a senha; o $$ deixa quem expande ser o shell do contêiner
    # start_period folgado: no primeiro boot o plugin do YouTube ainda é baixado
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H \"Authorization: $$LAVALINK_PASSWORD\" http://127.0.0.1:2333/version"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 90s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # 1,5 G pro heap de 1 G caber com a memória de fora dele; limite não é reserva
    # a soma dos limites passa dos 3,8 G da VPS, e o pico quem segura é o swapfile de 2 G
    deploy:
      resources:
        limits:
          memory: 1536M

  # Decifra as assinaturas do player do YouTube, que o plugin não acompanha. Sem `ports`.
  yt-cipher:
    image: ghcr.io/kikkia/yt-cipher:master
    container_name: alephbot-yt-cipher

    networks:
      - interna

    restart: unless-stopped
    init: true

    environment:
      TZ: America/Sao_Paulo
      # variante de player que o plugin espera; é a que o projeto recomenda
      OVERRIDE_PLAYER_VARIANT: IAS

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    deploy:
      resources:
        limits:
          memory: 256M

  # A saída pra internet de quem fala com o YouTube: do IP da AWS ele recusa o áudio, do WARP não
  # oferece SOCKS5 na 9091, pro yt-audio e pro Lavalink. O digest é o da imagem testada
  warp:
    image: ghcr.io/mon-ius/docker-warp-socks@sha256:5424011aea5d1ec7f84730a006e8888e5a2aae01b1377e6694b6ae0ef07e5737
    container_name: alephbot-warp

    networks:
      - interna

    restart: unless-stopped

    environment:
      TZ: America/Sao_Paulo

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    deploy:
      resources:
        limits:
          memory: 128M

  # O token anti-robô que o YouTube exige de quem não está logado; quem pede é o yt-audio
  # Sem `ports`. O digest é o da imagem testada na VPS (08/10/2026)
  pot:
    image: brainicism/bgutil-ytdlp-pot-provider@sha256:d7d34108b76e52c7d3b575fe9e797e4bf41c1b2a08f80c5292eff6f851ce8472
    container_name: alephbot-pot

    networks:
      - interna

    restart: unless-stopped
    init: true

    environment:
      TZ: America/Sao_Paulo

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    deploy:
      resources:
        limits:
          memory: 512M

  # O áudio do YouTube sem conta (YtAudio): o yt-dlp pega, pelo WARP e com o token do pot
  # o bot manda o Lavalink tocar o link dele; falhando, a faixa vai pelo plugin. Sem `ports`
  yt-audio:
    image: alephbot-yt-audio:latest
    container_name: alephbot-yt-audio

    networks:
      - interna

    build:
      context: ./YtAudio

    restart: unless-stopped
    init: true

    depends_on:
      - warp
      - pot

    environment:
      TZ: America/Sao_Paulo
      # a mesma saída nos três: o link do áudio só vale pro IP que pediu ele
      PROXY: socks5://warp:9091
      GERADOR_DE_TOKEN: http://pot:4416

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/saude', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # o deno sobe a cada desafio do player do YouTube; fora isso é um Python parado
    deploy:
      resources:
        limits:
          memory: 512M

  # A automação com a API, no n8n: aviso de queda, histórico, lista de comandos, painel e backup
  # os fluxos moram em n8n/fluxos, e quem instala é o n8n/instalar.sh. Só no localhost da VPS
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.42.4
    container_name: alephbot-n8n

    networks:
      - interna
      - dados

    restart: unless-stopped

    ports:
      - "127.0.0.1:5678:5678"

    environment:
      TZ: America/Sao_Paulo
      # o fuso das agendas ("todo dia às 3h")
      GENERIC_TIMEZONE: America/Sao_Paulo
      # nada de telemetria pra n8n.io nem questionário de boas-vindas
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      # os fluxos leem a URL, a chave e o webhook daqui ($env); o n8n 2 bloqueia de fábrica
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      # onde os fluxos podem gravar arquivo: a pasta n8n/arquivos, montada logo abaixo
      N8N_RESTRICT_FILE_ACCESS_TO: /home/node/.n8n-files

      # o heap do JavaScript, abaixo do limite do contêiner: sozinho o Node estoura
      NODE_OPTIONS: --max-old-space-size=640
      # o histórico de execuções guarda 7 dias, não os 14 de fábrica: o banco não incha
      EXECUTIONS_DATA_MAX_AGE: "168"
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: "5000"

      ALEPH_API_URL: http://alephbot:8080
      # a mesma API_KEY do Config/.env, repetida no .env da raiz: este contêiner não lê aquele
      ALEPH_API_KEY: ${ALEPH_API_KEY:-}
      # o webhook do canal que recebe os avisos
      ALEPH_DISCORD_WEBHOOK: ${ALEPH_DISCORD_WEBHOOK:-}

    volumes:
      # a conta, os fluxos, as execuções e a tabela do histórico (aleph_stats)
      - n8n-data:/home/node/.n8n
      # a lista de comandos e os backups, à vista em n8n/arquivos; a pasta é do UID 1000, como o
      # node
      - ./n8n/arquivos:/home/node/.n8n-files
      # os fluxos do repo, só pra importar
      - ./n8n/fluxos:/fluxos:ro

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # o n8n 2 sozinho fica perto de 450 MB; com 512M o Docker matava ele a cada pico
    deploy:
      resources:
        limits:
          memory: 1G

  # Onde mora o que o bot lembra de um boot pro outro. Sem `ports`: só o bot e o n8n alcançam.
  postgres:
    image: postgres:17-alpine
    container_name: alephbot-postgres

    networks:
      - dados

    restart: unless-stopped

    environment:
      POSTGRES_DB: aleph
      POSTGRES_USER: aleph
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env da raiz}
      TZ: America/Sao_Paulo

    # o padrão do Postgres é generoso demais pra VPS de 3,8 GB: 64 MB cabem no limite de 384
    command: >
      postgres
      -c shared_buffers=64MB
      -c max_connections=30
      -c work_mem=4MB
      -c maintenance_work_mem=32MB

    # Só no localhost, pra um cliente por túnel SSH. NUNCA 0.0.0.0: o Docker passa por cima do ufw
    ports:
      - "${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"

    volumes:
      - aleph-db:/var/lib/postgresql/data

    # o bot conecta depois que ele aceita conexão de verdade, não quando o contêiner existe
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aleph -d aleph"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    deploy:
      resources:
        limits:
          memory: 384M

# Duas redes: a "interna" pra cadeia do YouTube, e a "dados" pra quem precisa do banco
# declarar rede num serviço o tira da padrão, por isso todos dizem a sua
networks:
  interna:
  dados:

volumes:
  aleph-logs:
  aleph-data:
  aleph-db:
  lavalink-plugins:
  n8n-data:
