services:
  alephbot:
    image: alephbot:latest
    container_name: alephbot

    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_CONFIGURATION: Release

    # o bot precisa voltar sozinho depois de reboot da VPS
    restart: unless-stopped

    # PID 1 de verdade: repassa SIGTERM e recolhe processos órfãos
    init: true

    # tempo pro gateway fechar a conexão com o Discord antes do SIGKILL
    stop_grace_period: 20s

    # TOKEN, PREFIX, DEV_GUILD_ID, LOG_LEVEL — mesmo arquivo do dev,
    # que já está no .gitignore e no .dockerignore (não entra na imagem)
    env_file:
      - Config/.env

    environment:
      DOTNET_ENVIRONMENT: Production
      # o banner desliga cor sozinho quando a saída é redirecionada,
      # o NLog não — sem isso o `docker logs` vem cheio de escape ANSI
      NO_COLOR: "1"
      TZ: America/Sao_Paulo

      # dentro da rede do compose o Lavalink atende pelo nome do serviço, não por
      # localhost; isto vence o que estiver no Config/.env (environment > env_file)
      LAVALINK_URI: http://lavalink:2333/
      LAVALINK_PASSWORD: ${LAVALINK_PASSWORD:-youshallnotpass}

      # semente do login do YouTube: só é lida no primeiro boot (ou quando você cola um
      # token novo aqui). Depois disso o token em uso mora no volume aleph-data, porque
      # o Google pode trocar ele sem avisar e o .env não acompanharia. Pode ficar vazio:
      # com YOUTUBE_LOGIN ligado o bot pede o código no log e guarda sozinho
      YOUTUBE_REFRESH_TOKEN: ${YOUTUBE_REFRESH_TOKEN:-}

      # a API escuta sempre na 8080 do contêiner; quem escolhe a porta de fora é o `ports`
      # abaixo. Fixo aqui pra um API_PORT esquecido no Config/.env não desencontrar os dois
      API_PORT: "8080"

    # a API de status (só sobe com API_KEY no Config/.env). Publicada só no localhost da
    # máquina por padrão: a chave viaja em texto puro no HTTP, então pra abrir pra fora o
    # certo é um proxy com HTTPS na frente (Caddy, nginx). API_BIND=0.0.0.0 no .env da raiz
    # abre direto — e o Docker publica por cima do firewall (ufw), então abre mesmo
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8080}:8080"

    # espera o Lavalink responder antes de me criar: só ordenar a partida me fazia subir
    # uns 15 s antes dele aceitar conexão, e o boot abria com um stack trace de "connection
    # refused" antes da reconexão automática. Depois de reboot da VPS é o daemon quem sobe
    # os dois (restart policy), sem esta ordem — aí a reconexão sozinha continua valendo,
    # e /ping e /ban não dependem de música pra funcionar
    depends_on:
      lavalink:
        condition: service_healthy

    # os logs em arquivo do NLog (${basedir}/logs) e o token do YouTube sobrevivem ao recreate
    volumes:
      - aleph-logs:/app/logs
      - aleph-data:/app/data

    # o stdout do container também rotaciona, senão enche o disco da VPS
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    deploy:
      resources:
        limits:
          memory: 512M

  # quem decodifica o áudio e fala com a voz do Discord. Fica só na rede interna do
  # compose: sem `ports`, nada de fora alcança a porta 2333.
  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4.2.2
    container_name: alephbot-lavalink

    restart: unless-stopped
    init: true

    # o cipher precisa estar de pé antes: é ele que decifra as assinaturas do player
    depends_on:
      - yt-cipher

    environment:
      # o application.yml lê esta variável; a mesma vai pro bot logo acima, então
      # trocar a senha é mexer num lugar só (o .env da raiz)
      LAVALINK_PASSWORD: ${LAVALINK_PASSWORD:-youshallnotpass}
      TZ: America/Sao_Paulo
      # decodificar áudio é o trabalho dele; o resto do limite fica pro heap nativo
      _JAVA_OPTIONS: -Xmx700m

      # o token do YouTube não entra aqui: quem entrega é o bot, a cada conexão, pela
      # REST do plugin — assim um token invalidado não derruba o Lavalink no boot

      # "Sign in to confirm you're not a bot": o par abaixo é a resposta documentada pra
      # isso, e vale só pros clients WEB e WEBEMBEDDED. Gere os dois com
      #   docker run --rm quay.io/invidious/youtube-trusted-session-generator
      # e guarde no .env da raiz. Vazio = sem poToken, como antes.
      # (Spring mapeia PLUGINS_YOUTUBE_* por cima do application.yml montado)
      PLUGINS_YOUTUBE_POT_TOKEN: ${YOUTUBE_PO_TOKEN:-}
      PLUGINS_YOUTUBE_POT_VISITORDATA: ${YOUTUBE_VISITOR_DATA:-}

    volumes:
      - ./Lavalink/application.yml:/opt/Lavalink/application.yml:ro
      # sem isto o plugin do YouTube é baixado de novo a cada recreate
      - lavalink-plugins:/opt/Lavalink/plugins

    # toda rota do Lavalink pede a senha, /version inclusive — sem ela o check leva 401 e
    # o container fica "unhealthy" pra sempre. O $$ é pra o compose não interpolar: quem
    # expande é o shell dentro do container, que já tem a variável. A imagem
    # (eclipse-temurin) traz o curl. start_period folgado de propósito: no primeiro boot
    # o plugin do YouTube ainda é baixado antes do servidor abrir a porta
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H \"Authorization: $$LAVALINK_PASSWORD\" http://127.0.0.1:2333/version"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 90s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    deploy:
      resources:
        limits:
          memory: 1G

  # Decifra as assinaturas do player do YouTube pro plugin do Lavalink.
  #
  # O YouTube troca o base.js toda hora, e o decifrador local do plugin quebra junto
  # ("Must find sig function from script"). Este serviço roda o JS de verdade e devolve a
  # assinatura resolvida, então mudança de player vira problema dele, não nosso.
  #
  # Sem `ports`: só o Lavalink alcança, pela rede interna do compose.
  yt-cipher:
    image: ghcr.io/kikkia/yt-cipher:master
    container_name: alephbot-yt-cipher

    restart: unless-stopped
    init: true

    environment:
      TZ: America/Sao_Paulo
      # variante de player que o plugin espera; é a que o projeto recomenda
      OVERRIDE_PLAYER_VARIANT: IAS

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    deploy:
      resources:
        limits:
          memory: 256M

  # A automação com a API, no n8n: avisa no Discord quando o bot cai, guarda o histórico dos
  # stats, mantém a lista de comandos em Markdown, serve um painel com gráficos e faz um
  # backup por dia. Os fluxos moram em n8n/fluxos; quem importa e publica é o
  # n8n/instalar.sh.
  #
  # Só no localhost da VPS: a porta abre em 127.0.0.1 e chega no seu navegador pelo túnel
  # SSH, como a API. A API ele chama pela rede interna do compose, como quem é de dentro.
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.42.4
    container_name: alephbot-n8n

    restart: unless-stopped

    ports:
      - "127.0.0.1:5678:5678"

    environment:
      TZ: America/Sao_Paulo
      # o fuso das agendas ("todo dia às 3h")
      GENERIC_TIMEZONE: America/Sao_Paulo
      # nada de telemetria pra n8n.io nem questionário de boas-vindas
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      # os fluxos leem a URL, a chave e o webhook daqui ($env). O n8n 2 bloqueia isso de
      # fábrica; liberar não abre nada pra fora, só quem tem a conta de dono mexe em fluxo
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      # onde os fluxos podem gravar arquivo: a pasta n8n/arquivos, montada logo abaixo
      N8N_RESTRICT_FILE_ACCESS_TO: /home/node/.n8n-files

      ALEPH_API_URL: http://alephbot:8080
      # a mesma API_KEY do Config/.env, repetida no .env da raiz: este container não lê o
      # Config/.env, que tem o token do Discord
      ALEPH_API_KEY: ${ALEPH_API_KEY:-}
      # o webhook do canal que recebe os avisos
      ALEPH_DISCORD_WEBHOOK: ${ALEPH_DISCORD_WEBHOOK:-}

    volumes:
      # a conta, os fluxos, as execuções e a tabela do histórico (aleph_stats)
      - n8n-data:/home/node/.n8n
      # a lista de comandos e os backups, à vista em n8n/arquivos na VPS. A pasta vem do
      # git, criada pelo seu usuário — o mesmo UID 1000 do usuário node do n8n, que grava nela
      - ./n8n/arquivos:/home/node/.n8n-files
      # os fluxos do repo, só pra importar
      - ./n8n/fluxos:/fluxos:ro

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  aleph-logs:
  aleph-data:
  lavalink-plugins:
  n8n-data:
