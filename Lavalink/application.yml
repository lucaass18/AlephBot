server:
  address: 0.0.0.0
  port: 2333

lavalink:
  plugins:
    # o Lavalink 4 tirou o YouTube nativo; sem este plugin /play não acha vídeo nenhum.
    #
    # Snapshot, e não release, de propósito: em 18/08/2026 o YouTube passou a recusar o
    # User-Agent (família Cobalt) que o client TV manda, e o playback morre com "The page
    # needs to be reloaded" — issue #226. A correção troca o UA por um de PlayStation 4
    # (PR #233) e ainda não saiu em versão estável: a 1.18.2 é de 27/07, o fix é de 19/08.
    # Este hash é o topo da main com ela dentro. Quando sair a 1.18.3, dá pra voltar
    # pro repositório de releases e usar o número da versão.
    - dependency: "dev.lavalink.youtube:youtube-plugin:f45bbb7aebfcbc1c553769e04af6cd43afa8b7c3"
      repository: "https://maven.lavalink.dev/snapshots"
      snapshot: true

  server:
    # o docker compose injeta LAVALINK_PASSWORD nos dois contêineres a partir do .env
    # da raiz; o padrão aqui é só pra quem sobe o servidor na mão pra testar
    password: "${LAVALINK_PASSWORD:youshallnotpass}"

    sources:
      # desligado de propósito: quem responde por YouTube agora é o plugin acima, e
      # deixar os dois ligados faz a fonte velha (quebrada) ganhar
      youtube: false
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      nico: false
      http: true
      local: false

    filters:
      volume: true
      equalizer: true
      karaoke: false
      timescale: false
      tremolo: false
      vibrato: false
      distortion: false
      rotation: false
      channelMix: false
      lowPass: false

    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingQuality: 10
    resamplingQuality: LOW
    trackStuckThresholdMs: 10000
    useSeekGhosting: true

    # playlist gigante trava o /play por segundos e enche a fila de coisa que ninguém
    # vai ouvir; 6 páginas (600 faixas) já é mais do que qualquer servidor precisa
    youtubePlaylistLoadLimit: 6

    playerUpdateInterval: 5
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true
    gc-warnings: true

plugins:
  youtube:
    enabled: true

    # de IP de datacenter (EC2 e afins) o YouTube responde "This video requires login"
    # em vídeo público: a busca passa, o áudio não. No compose quem entrega o áudio é o
    # yt-audio (o bot manda o Lavalink tocar o link dele); o login fica de reserva, pra
    # quando ele falhar. Logado, o plugin volta a entregar o stream.
    oauth:
      enabled: true
      # quem pede o login é o bot (YOUTUBE_LOGIN no Config/.env), pra o código sair no
      # console dele e não aqui. Sem isto o Lavalink abriria um segundo fluxo, com outro
      # código, e sobrariam dois pedidos de login pro mesmo servidor
      skipInitialization: true
      # sem refreshToken de propósito: o bot guarda o token e entrega pelo POST /youtube a
      # cada conexão. Token aqui seria testado no Google durante o boot, e um token que o
      # Google já invalidou derrubava o Lavalink inteiro antes de qualquer música

    # quem decifra as assinaturas é o serviço yt-cipher do compose. O decifrador local
    # do plugin quebra a cada mudança do base.js do YouTube; este acompanha
    remoteCipher:
      url: "http://yt-cipher:8001"

    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true

    # a ordem importa: pra cada pedido o Lavalink tenta um client por vez, pulando os que
    # não atendem aquele tipo, até algum dar conta.
    #
    # No compose o plugin não toca o YouTube: ele busca, lê os dados de um link e, quando o
    # yt-audio falha, ainda tenta tocar. O MUSIC só atende a busca do YouTube Music
    # (ytmsearch:). O TV vem logo depois: é o único que sabe usar o OAuth e é quem toca na
    # reserva quando há login (sem ele na lista um token seria renovado e nunca usado) —
    # sem token ele falha rápido, e busca e link ele nem atende. A busca normal (ytsearch:,
    # a que o bot usa) e os links caem no WEB, que pelo WARP o YouTube atende; os outros
    # ficam de reserva dele.
    #
    # Se as buscas começarem a falhar, é esta lista que se mexe — o README do plugin mantém
    # a ordem recomendada do momento.
    clients:
      - MUSIC
      - TV
      - WEB
      - WEBEMBEDDED
      - ANDROID_VR
      - TVHTML5_SIMPLY

metrics:
  prometheus:
    enabled: false

logging:
  file:
    path: ./logs/
  level:
    root: INFO
    lavalink: INFO
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 5
